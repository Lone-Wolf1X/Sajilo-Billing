<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नेपाली बिल - सेतो र रातो (White & Red Nepali Bill)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper-bg: #ffffff;
      --ink-red: #b91c1c;
      --ink-red-dark: #991b1b;
      --ink-red-light: #fef2f2;
      --ink-border: #dc2626;
      --text-dark: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e293b;
      font-family: 'Mukta', 'Noto Sans Devanagari', sans-serif;
      color: var(--ink-red);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 12px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Control Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .btn {
      font-family: 'Mukta', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid #ddd;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      background: #f8fafc;
      color: #1e293b;
    }

    .btn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .btn-red {
      background: var(--ink-red);
      color: #ffffff;
      border-color: var(--ink-red);
    }

    .btn-red:hover {
      background: var(--ink-red-dark);
    }

    /* Bill Container */
    .bill-wrapper {
      width: 100%;
      max-width: 580px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      border-radius: 4px;
      overflow: hidden;
    }

    .bill-card {
      background-color: var(--paper-bg);
      color: var(--ink-red);
      padding: 26px 28px 22px 28px;
      position: relative;
      border: 2px solid var(--ink-border);
      display: flex;
      flex-direction: column;
      min-height: 820px;
    }

    /* Header Section */
    .bill-header {
      position: relative;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--ink-red);
      padding-bottom: 8px;
    }

    .phone-number {
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .company-title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      color: var(--ink-red-dark);
    }

    .company-address {
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* Metadata Info */
    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 14.5px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      width: 100%;
    }

    .info-row-between {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
    }

    .field-label {
      white-space: nowrap;
      margin-right: 6px;
      font-weight: 700;
      color: var(--ink-red);
    }

    .dotted-line {
      flex: 1;
      border-bottom: 1px dotted var(--ink-red);
      min-height: 14px;
      padding-left: 8px;
      font-weight: 600;
      color: #0f172a;
    }

    /* PAN Box Grid */
    .pan-row {
      display: flex;
      align-items: center;
      margin: 2px 0;
    }

    .pan-boxes {
      display: inline-flex;
      border: 1.5px solid var(--ink-red);
      background: var(--ink-red-light);
      margin-left: 8px;
    }

    .pan-box {
      width: 25px;
      height: 25px;
      border-right: 1.5px solid var(--ink-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      color: var(--ink-red-dark);
    }

    .pan-box:last-child {
      border-right: none;
    }

    /* Main Table */
    .bill-table-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1.5px solid var(--ink-red);
      margin-top: 2px;
      margin-bottom: 14px;
    }

    .bill-table {
      width: 100%;
      border-collapse: collapse;
      height: 100%;
    }

    .bill-table th,
    .bill-table td {
      border-right: 1.5px solid var(--ink-red);
      padding: 5px 6px;
    }

    .bill-table th:last-child,
    .bill-table td:last-child {
      border-right: none;
    }

    .bill-table thead tr {
      border-bottom: 1.5px solid var(--ink-red);
      background-color: var(--ink-red-light);
    }

    .bill-table th {
      font-size: 14.5px;
      font-weight: 700;
      text-align: center;
      color: var(--ink-red-dark);
      padding: 6px 4px;
    }

    .col-sn {
      width: 44px;
      text-align: center;
    }

    .col-desc {
      width: auto;
      text-align: left;
    }

    .col-qty {
      width: 66px;
      text-align: center;
    }

    .col-rate {
      width: 66px;
      text-align: right;
    }

    .col-amount {
      width: 78px;
      text-align: right;
    }

    .table-body-row {
      height: 28px;
    }

    .table-body-row td {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      vertical-align: middle;
    }

    .table-spacer-row {
      height: auto;
    }

    /* Total Row */
    .total-row {
      border-top: 1.5px solid var(--ink-red);
      background-color: var(--ink-red-light);
      font-weight: 800;
      font-size: 14.5px;
    }

    .total-row td {
      padding: 6px 6px;
    }

    .total-label {
      text-align: center;
      letter-spacing: 0.5px;
      color: var(--ink-red-dark);
    }

    .total-amount {
      text-align: right;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-red-dark);
    }

    /* In Words Row */
    .in-words-row {
      border-top: 1.5px solid var(--ink-red);
      padding: 6px 8px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: baseline;
      background-color: #fff;
    }

    /* Footer Section */
    .bill-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 4px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.45;
    }

    .terms {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--ink-red-dark);
    }

    .term-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .arrow-icon {
      font-size: 11px;
      color: var(--ink-red);
    }

    .signature-area {
      text-align: center;
      padding-top: 28px;
      border-top: 1px dotted var(--ink-red);
      min-width: 120px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-red);
    }

    /* Editable inline styling */
    [contenteditable="true"]:hover {
      background: #f1f5f9;
    }

    [contenteditable="true"]:focus {
      background: #e2e8f0;
      outline: none;
      border-radius: 2px;
    }

    /* Print Styles */
    @media print {
      body {
        background: transparent;
        padding: 0;
        margin: 0;
      }

      .controls-bar {
        display: none !important;
      }

      .bill-wrapper {
        box-shadow: none;
        max-width: 100%;
        border-radius: 0;
      }

      .bill-card {
        min-height: 100vh;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="controls-bar">
    <button class="btn btn-red" onclick="window.print()">
      🖨️ प्रिन्ट गर्नुहोस् (Print)
    </button>
    <button class="btn" onclick="populateSampleData()">
      ✏️ नमुना डाटा भर्नुहोस् (Sample)
    </button>
    <button class="btn" onclick="clearBill()">
      🗑️ खाली गर्नुहोस् (Blank)
    </button>
  </div>

  <!-- Bill Wrapper -->
  <div class="bill-wrapper">
    <div class="bill-card">

      <!-- Header -->
      <div class="bill-header">
        <div class="phone-number" contenteditable="true">मो. ९८०५६७८४५६</div>
        <div class="company-title" contenteditable="true">जानकारी केन्द्र (प्रा.) ली.</div>
        <div class="company-address" contenteditable="true">पुतलीसडक, काठमाडौँ</div>
      </div>

      <!-- Info Meta -->
      <div class="info-grid">
        <div class="info-row-between">
          <div class="info-row" style="flex: 0 0 45%;">
            <span class="field-label">बिल नं. :</span>
            <span class="dotted-line" contenteditable="true" id="billNoField"></span>
          </div>
          <div class="info-row" style="flex: 0 0 50%;">
            <span class="field-label">मिति :</span>
            <span class="dotted-line" contenteditable="true" id="dateField"></span>
          </div>
        </div>

        <!-- 9-Digit PAN Row -->
        <div class="pan-row">
          <span class="field-label">पान नं.</span>
          <div class="pan-boxes">
            <span class="pan-box" contenteditable="true">६</span>
            <span class="pan-box" contenteditable="true">९</span>
            <span class="pan-box" contenteditable="true">४</span>
            <span class="pan-box" contenteditable="true">८</span>
            <span class="pan-box" contenteditable="true">०</span>
            <span class="pan-box" contenteditable="true">७</span>
            <span class="pan-box" contenteditable="true">६</span>
            <span class="pan-box" contenteditable="true">३</span>
            <span class="pan-box" contenteditable="true">८</span>
          </div>
        </div>

        <div class="info-row">
          <span class="field-label">नाम :</span>
          <span class="dotted-line" contenteditable="true" id="customerNameField"></span>
        </div>

        <div class="info-row">
          <span class="field-label">ठेगाना :</span>
          <span class="dotted-line" contenteditable="true" id="customerAddressField"></span>
        </div>
      </div>

      <!-- Table -->
      <div class="bill-table-container">
        <table class="bill-table">
          <thead>
            <tr>
              <th class="col-sn">क्र.स</th>
              <th class="col-desc">विवरण</th>
              <th class="col-qty">परिमाण</th>
              <th class="col-rate">दर</th>
              <th class="col-amount">रकम</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-body-row">
              <td class="col-sn" contenteditable="true"></td>
              <td class="col-desc" contenteditable="true"></td>
              <td class="col-qty" contenteditable="true"></td>
              <td class="col-rate" contenteditable="true"></td>
              <td class="col-amount" contenteditable="true"></td>
            </tr>
            <tr class="table-spacer-row" style="height: 120px;">
              <td class="col-sn"></td>
              <td class="col-desc"></td>
              <td class="col-qty"></td>
              <td class="col-rate"></td>
              <td class="col-amount"></td>
            </tr>
            <tr class="total-row">
              <td colspan="3" style="border-right: 1.5px solid var(--ink-red);"></td>
              <td class="total-label">जम्मा</td>
              <td class="total-amount" contenteditable="true" id="totalAmountField"></td>
            </tr>
          </tbody>
        </table>

        <div class="in-words-row">
          <span class="field-label">अक्षरेपी :</span>
          <span class="dotted-line" contenteditable="true" id="inWordsField"></span>
        </div>
      </div>

      <!-- Footer -->
      <div class="bill-footer">
        <div class="terms">
          <div class="term-item">
            <span class="arrow-icon">➤</span>
            <span>भूलचुक लिने दिने ।</span>
          </div>
          <div class="term-item">
            <span class="arrow-icon">➤</span>
            <span>बिक्री भएको सामान फिर्ता हुने छैन ।</span>
          </div>
        </div>

        <div class="signature-area">
          हस्ताक्षर
        </div>
      </div>

    </div>
  </div>

  <script>
    function populateSampleData() {
      document.getElementById('billNoField').innerText = '१०५४';
      document.getElementById('dateField').innerText = '२०८१/०७/२४';
      document.getElementById('customerNameField').innerText = 'हरि प्रसाद शर्मा';
      document.getElementById('customerAddressField').innerText = 'कोटेश्वर, काठमाडौँ';

      const rows = [
        ['१', 'खाता / रजिस्टर', '२ थान', '३५०/-', '७००/-'],
        ['२', 'डटपेन (कालो/नीलो)', '५ थान', '२५/-', '१२५/-'],
        ['३', 'A4 फोटोकपी पेपर रिम', '१ रिम', '६५०/-', '६५०/-']
      ];

      const tbody = document.getElementById('tableBody');
      const tableRows = tbody.querySelectorAll('.table-body-row');

      rows.forEach((data, idx) => {
        if (tableRows[idx]) {
          const cells = tableRows[idx].querySelectorAll('td');
          cells[0].innerText = data[0];
          cells[1].innerText = data[1];
          cells[2].innerText = data[2];
          cells[3].innerText = data[3];
          cells[4].innerText = data[4];
        }
      });

      document.getElementById('totalAmountField').innerText = '१,४७५/-';
      document.getElementById('inWordsField').innerText = 'एक हजार चार सय पचहत्तर रुपैयाँ मात्र ।';
    }

    function clearBill() {
      document.getElementById('billNoField').innerText = '';
      document.getElementById('dateField').innerText = '';
      document.getElementById('customerNameField').innerText = '';
      document.getElementById('customerAddressField').innerText = '';
      document.getElementById('totalAmountField').innerText = '';
      document.getElementById('inWordsField').innerText = '';

      const tbody = document.getElementById('tableBody');
      const tableRows = tbody.querySelectorAll('.table-body-row');
      tableRows.forEach(row => {
        row.querySelectorAll('td').forEach(cell => cell.innerText = '');
      });
    }
  </script>
</body>
</html>
