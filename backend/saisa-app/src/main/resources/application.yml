spring:
  application:
    name: saisa-accounting

  datasource:
    url: jdbc:postgresql://localhost:5432/saisa_dev
    username: ${DB_USERNAME:abhisekpaswan}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:nextgeninnovationsprivatelimit@gmail.com}
    password: ${SMTP_PASSWORD:mdvx fwry lrmd pwsc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true          # enables /liveness and /readiness
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: saisa-accounting
      environment: ${SPRING_PROFILES_ACTIVE:default}
  prometheus:
    metrics:
      export:
        enabled: true

saisa:
  platform:
    seed-enabled: ${PLATFORM_SEED_ENABLED:true}
    superadmin-username: ${PLATFORM_ADMIN_USERNAME:superadmin}
    superadmin-email: ${PLATFORM_ADMIN_EMAIL:nextgeninnovationsprivatelimit@gmail.com}
    superadmin-password: ${PLATFORM_ADMIN_PASSWORD:ChangeMe#2026}
    superadmin-full-name: ${PLATFORM_ADMIN_FULLNAME:NextGen Administrator}
  jwt:
    # Generate a new secret: openssl rand -base64 64
    # NEVER commit production secret to git. Use env var in prod.
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWtleS1mb3Itc2Fpc2EtYWNjb3VudGluZy1kby1ub3QtdXNlLWluLXByb2Q=}
    access-token-validity-minutes: 15

